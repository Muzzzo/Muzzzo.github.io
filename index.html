<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christopher Musonda | Computer Engineer & AI Systems Builder</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.18);
      --bg: #f1f5f9;
      --card: #ffffff;
      --card-alt: #f8fafc;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --pill-bg: #eff6ff;
      --pill-text: #1e40af;
      --pill-border: #bfdbfe;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    [data-theme="dark"] {
      --primary: #f8fafc;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --bg: #0b1120;
      --card: #111827;
      --card-alt: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
      --pill-bg: rgba(56, 189, 248, 0.12);
      --pill-text: #7dd3fc;
      --pill-border: rgba(56, 189, 248, 0.3);
      --shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Public Visitor Toolbar */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .toolbar-brand {
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.25); }
    }

    /* Private Admin Bar */
    .admin-bar {
      display: none;
      background: linear-gradient(90deg, #1e1b4b, #312e81);
      color: #e0e7ff;
      padding: 10px 24px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid #4338ca;
      font-size: 0.85rem;
    }
    body.is-admin .admin-bar { display: flex; }

    .admin-badge {
      background: #4f46e5;
      color: #fff;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }

    .toolbar-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn {
      border: none;
      padding: 7px 13px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-outline { background: rgba(255,255,255,0.08); color: #f8fafc; border: 1px solid #475569; }
    .btn-outline:hover { background: rgba(255,255,255,0.16); }
    .btn-warning { background: #f59e0b; color: #0f172a; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }

    /* Main Sheet */
    .container {
      max-width: 940px;
      margin: 32px auto;
      background: var(--card);
      padding: 44px 52px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* Hero Header */
    header {
      display: flex;
      align-items: center;
      gap: 26px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 22px;
      margin-bottom: 24px;
    }
    .profile-wrapper { position: relative; flex-shrink: 0; }
    .profile-pic {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      box-shadow: 0 0 0 5px var(--accent-glow);
      display: block;
    }
    .photo-upload-btn {
      display: none;
      margin-top: 8px;
      width: 112px;
      padding: 5px 6px;
      font-size: 0.75rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    body.editing .photo-upload-btn { display: block; }

    .header-info { flex: 1; }
    h1 { font-size: 2.1rem; color: var(--primary); line-height: 1.15; letter-spacing: -0.5px; }
    .subtitle { font-size: 1.05rem; color: var(--accent); font-weight: 600; margin-top: 5px; }
    .contact-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .contact-bar a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .contact-bar a:hover { text-decoration: underline; }

    /* Sections */
    section { margin-bottom: 26px; }
    h2 {
      font-size: 0.98rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--primary);
      border-bottom: 1.5px solid var(--border);
      padding-bottom: 6px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-add-btn {
      display: none;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 3px 10px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
    }
    body.editing .admin-add-btn { display: inline-block; }

    /* Filter Tabs */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .filter-btn {
      background: var(--card-alt);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Project Cards */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }
    .project-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      background: var(--card-alt);
      transition: transform 0.2s ease, border-color 0.2s ease, opacity 0.25s ease;
    }
    .project-card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .project-card.dimmed { opacity: 0.35; }
    .project-card h3 { font-size: 1rem; color: var(--primary); margin-bottom: 4px; }
    .project-tags { font-size: 0.78rem; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
    .project-links { margin-top: 10px; display: flex; gap: 14px; font-size: 0.85rem; }
    .project-links a { color: var(--accent); font-weight: 600; text-decoration: none; }

    /* Experience & Competency Grids */
    .item {
      margin-bottom: 18px;
      padding-left: 14px;
      border-left: 2px solid var(--border);
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      font-weight: 700;
      color: var(--primary);
    }
    .item-sub { font-size: 0.88rem; color: var(--muted); margin-bottom: 6px; }
    ul { padding-left: 18px; }
    li { margin-bottom: 5px; font-size: 0.93rem; }

    .two-col-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .info-box {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .info-box h4 {
      font-size: 0.9rem;
      color: var(--primary);
      margin-bottom: 6px;
    }

    /* Skills Pills */
    .skills-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .skill-pill {
      background: var(--pill-bg);
      color: var(--pill-text);
      border: 1px solid var(--pill-border);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 500;
      transition: opacity 0.25s ease;
    }
    .skill-pill.dimmed { opacity: 0.3; }

    /* Edit Mode Highlighting */
    body.editing [contenteditable="true"] {
      outline: 2px dashed var(--accent);
      background: var(--pill-bg);
      border-radius: 4px;
      padding: 2px 5px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #fff;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      border-left: 4px solid #10b981;
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* Dedicated 2-Page A4 Print / PDF Styles */
    @page {
      size: A4 portrait;
      margin: 14mm 15mm;
    }
    @media print {
      body, [data-theme="dark"] {
        background: #fff !important;
        color: #1e293b !important;
        font-size: 10.5pt;
        line-height: 1.5;
      }
      .toolbar, .admin-bar, .no-print, .photo-upload-btn, .filter-bar, .admin-add-btn, .toast {
        display: none !important;
      }
      .container {
